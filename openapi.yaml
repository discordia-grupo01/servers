          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the banner image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server has no banner, or not found
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      summary: Get a server's banner
      tags:
        - servers
  "/v1/servers/{serverId}/bans":
    get:
      description: Requires BAN_MEMBERS (the owner and administrators hold it
        implicitly). Newest first, paginated. Each ban carries the banned user's
        public profile (name, avatar, description, status), replicated from
        identify; profile is null until it has been replicated, and may lag a
        few seconds behind a profile edit. A banned user is no longer a member,
        so this is the only place to get it.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Page size (max 100)
          in: query
          name: limit
          schema:
            type: integer
            default: 20
        - description: Items to skip
          in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/moderation.BanListResponse"
        "400":
          description: invalid limit/offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing BAN_MEMBERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List the server's bans
      tags:
        - moderation
    post:
      description: Requires BAN_MEMBERS (the owner and administrators hold it
        implicitly). The target must be a current member ranked strictly below
        the caller in the role hierarchy; the owner and the caller themselves
        can't be banned. The member is removed (with their roles), a pending
        ownership transfer to them is cancelled, and they can't rejoin through
        any invitation until the ban is revoked. `reason` is optional (max 512
        characters).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/moderation_handler.banRequest"
        description: Who to ban and, optionally, why
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/moderation.BanResponse"
        "400":
          description: missing user_id, banning yourself, or invalid reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing BAN_MEMBERS, target is the owner, or target has an equal or
            higher role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or target is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: target is already banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Ban a member from the server
      tags:
        - moderation
  "/v1/servers/{serverId}/bans/{userId}":
    delete:
      description: "Requires BAN_MEMBERS (the owner and administrators hold it
        implicitly). There is no hierarchy check. The user does not become a
        member again: they can rejoin with any valid invitation, and get the
        default role like any new member."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: ID of the banned user
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid server id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing BAN_MEMBERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or the user is not banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Revoke a ban
      tags:
        - moderation
