  "/v1/servers/{serverId}/emojis":
    get:
      description: Any member of the server. Oldest first, without the deleted ones.
        max_emojis is the number of slots the server has.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/emoji.ListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's custom emojis
      tags:
        - emojis
    post:
      description: Requires MANAGE_SERVER (the owner and administrators hold it
        implicitly). Multipart form with name (2 to 32 letters, numbers or
        underscores, unique in the server ignoring case) and image (PNG, WebP or
        GIF, at most 5 MB, detected from the file's content). A GIF creates an
        animated emoji. A server has 50 slots, 70 from boost level 1; deleted
        emojis free theirs. A server that drops a level keeps the emojis it has,
        but can't add more until it is under the limit.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: Emoji name
                  type: string
                image:
                  description: Emoji image
                  type: string
                  format: binary
              required:
                - name
                - image
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/emoji.Response"
        "400":
          description: invalid name, or image missing, too large or of an unsupported type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_SERVER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: emoji_name_taken or emoji_limit_reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Add a custom emoji to a server
      tags:
        - emojis
