            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's invitations
      tags:
        - invitations
    post:
      description: Administrators, or members whose roles grant CREATE_INVITE. Body is
        optional JSON; omitting max_uses means unlimited uses. Expires in 7
        days.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.GenerateInvitationRequest"
        description: Optional max_uses
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.InvitationResponse"
        "400":
          description: invalid max_uses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller cannot invite (not an administrator nor holds CREATE_INVITE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Generate an invitation
      tags:
        - invitations
  "/v1/servers/{serverId}/kicks":
    post:
      description: Requires KICK_MEMBERS (the owner and administrators hold it
        implicitly). The target must be a current member ranked strictly below
        the caller in the role hierarchy; the owner and the caller themselves
        can't be kicked (to leave, use DELETE
        /v1/servers/{serverId}/members/{userId}). The member is removed (with
        their roles) and a pending ownership transfer to them is cancelled.
        Unlike a ban, they can rejoin with any valid invitation.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/moderation_handler.kickRequest"
        description: Who to kick
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: missing user_id, or kicking yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing KICK_MEMBERS, target is the owner, or target has an equal
            or higher role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or target is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Kick a member from the server
      tags:
        - moderation
  "/v1/servers/{serverId}/members":
    get:
      description: Caller must already be a member. Paginated. Each member carries
        their public profile (name, avatar, description, status), replicated
        from identify; profile is null until it has been replicated, and may lag
        a few seconds behind a profile edit. A member suspended at platform
        level stays in the list but with a null profile (no name or avatar of
        their own) until reactivated. muted_until is when the member's active
        mute ends, or null if they aren't muted (an expired mute counts as not
        muted).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Keep only members whose name contains this, ignoring case and
            accents. Members without a visible profile never match.
          in: query
          name: q
          schema:
            type: string
        - description: Page size
          in: query
          name: limit
          schema:
            type: integer
            default: 20
        - description: Items to skip
          in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.MemberListResponse"
        "400":
          description: invalid limit/offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller is not a member, or the caller's account is suspended
            (details.error_code ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's members
      tags:
        - membership
  "/v1/servers/{serverId}/members/{userId}":
    delete:
      description: "Self-leave only: userId must be the caller's own. The owner cannot
        leave (transfer ownership or delete the server first)."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Must match the caller's own user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: userId is not the caller
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: the owner cannot leave; transfer ownership or delete the server first
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Leave a server
      tags:
        - membership
  "/v1/servers/{serverId}/members/{userId}/permissions":
    get:
      description: "The permissions the member actually holds: every permission for
        the owner and for members with ADMINISTRATOR, otherwise the union of the
        permissions of their roles. Any member of the server can look up any
        other member."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/member_role_handler.memberPermissionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or the user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a member's effective permissions
      tags:
        - member-roles
  "/v1/servers/{serverId}/members/{userId}/roles":
    get:
      description: Any member of the server can look up any other member.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/roleview.Response"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or the user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a member's roles
      tags:
        - member-roles
    post:
      description: "Administrators only (the owner, or a member with ADMINISTRATOR).
        Idempotent: assigning a role the member already has succeeds without
        changing anything."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/member_role_handler.assignRoleRequest"
        description: ID of the role to assign
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or the role is not below your highest
            role, or the role carries a permission you do not hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Assign a role to a member
      tags:
        - member-roles
  "/v1/servers/{serverId}/members/{userId}/roles/{roleId}":
    delete:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or unassigning a role with
            ADMINISTRATOR from yourself, or the role is not below your highest
            role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server or role not found, or the member doesn't have the role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Remove a role from a member
      tags:
        - member-roles
  "/v1/servers/{serverId}/membership":
    get:
      description: Confirms that the authenticated user owns the server or is a member
        of it, without loading the server. Meant for services that poll it
        (voice presence). 403 for a non-member, 404 if the server does not
