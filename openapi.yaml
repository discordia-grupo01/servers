openapi: 3.0.0
info:
  contact: {}
  description: >-
    Servers service: servers, channels, categories, roles, member roles,
    membership, invitations, ownership transfer.

    All /v1/** routes require identity: the JWT is validated by Kong at the gateway, and this service takes the user id from the X-User-Id header (or from the "sub" claim of the token Kong forwards).
  title: Discordia - Servers
  version: 1.0.0
paths:
  /livez:
    get:
      responses:
        "200":
          description: ok
      summary: Liveness check
      tags:
        - ops
  /readyz:
    get:
      description: Also pings the database when one is configured.
      responses:
        "200":
          description: ready
        "503":
          description: database unavailable
      summary: Readiness check
      tags:
        - ops
  "/v1/categories/{categoryId}":
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Category ID
          in: path
          name: categoryId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/category_handler.updateCategoryRequest"
        description: New category name
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Rename a category
      tags:
        - categories
  "/v1/channels/{channelId}":
    delete:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete a channel
      tags:
        - channels
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `name`/`topic` omitted leave the field unchanged.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channel_handler.updateChannelRequest"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit a channel
      tags:
        - channels
  "/v1/channels/{channelId}/category":
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `category_id` omitted/null moves it to the server's "Sin asignar"
        fallback category ("no category" is not a valid state).
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channel_handler.moveChannelRequest"
        description: Target category (or null)
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Move a channel to a category
      tags:
        - channels
  "/v1/invites/{code}":
    delete:
      description: "Administrators revoke any invitation of the server; any member can
        revoke the ones they created. Idempotent: revoking an already-revoked
        code still returns 204."
      parameters:
        - description: Invitation code
          in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not an administrator nor the invitation's creator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: invitation not found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Revoke an invitation
      tags:
        - invitations
  "/v1/invites/{code}/join":
    post:
      description: One-step join (no separate "preview" endpoint). Returns 200 instead
        of 201 if the caller was already a member.
      parameters:
        - description: Invitation code
          in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.JoinResponse"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.JoinResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: user is banned from the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: invalid, revoked, expired or exhausted code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Join a server via an invitation code
      tags:
        - invitations
  "/v1/roles/{roleId}":
    delete:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or deleting a role with ADMINISTRATOR
            that you hold, or the role is not below your highest role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete a role
      tags:
        - roles
    get:
      description: Any member of the role's server.
      parameters:
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the role's server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a role
      tags:
        - roles
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        Any of `permissions`/`name`/`color` may be omitted to leave it
        unchanged.
      parameters:
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.updateRolePermissionsRequest"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or removing ADMINISTRATOR from a role
            you hold, or the role is not below your highest role, or adding a
            permission you do not hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit a role
      tags:
        - roles
  /v1/servers:
    get:
      description: Servers the caller is a member of.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/handler.serverResponse"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List my servers
      tags:
        - servers
    post:
      description: Creates a server owned by the caller (identity from the JWT).
        Multipart form body.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: Server name
                  type: string
                icon:
                  description: Server icon image
                  type: string
                  format: binary
              required:
                - name
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.serverResponse"
        "400":
          description: invalid name, or icon too large/unreadable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a server
      tags:
        - servers
  "/v1/servers/{serverId}":
    get:
      description: Full detail of one server, including its channels and categories.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.serverResponse"
        "400":
          description: malformed serverId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a server
      tags:
        - servers
    patch:
      description: "Administrators only (the owner, or a member with ADMINISTRATOR).
        Multipart form, all fields optional: rename, replace the icon/banner, or
        remove the banner."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: New server name
                  type: string
                icon:
                  description: New icon image
                  type: string
                  format: binary
                banner:
                  description: New banner image
                  type: string
                  format: binary
                remove_banner:
                  description: Pass \
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.serverResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit a server
      tags:
        - servers
  "/v1/servers/{serverId}/banner":
    get:
      description: Public (no JWT required) -- binary image, so a plain `<img src>`
        can load it.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the banner image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server has no banner, or not found
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      summary: Get a server's banner
      tags:
        - servers
  "/v1/servers/{serverId}/bans":
    get:
      description: Requires BAN_MEMBERS (the owner and administrators hold it
        implicitly). Newest first, paginated.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Page size (max 100)
          in: query
          name: limit
          schema:
            type: integer
            default: 20
        - description: Items to skip
          in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/moderation.BanListResponse"
        "400":
          description: invalid limit/offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing BAN_MEMBERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List the server's bans
      tags:
        - moderation
    post:
      description: Requires BAN_MEMBERS (the owner and administrators hold it
        implicitly). The target must be a current member ranked strictly below
        the caller in the role hierarchy; the owner and the caller themselves
        can't be banned. The member is removed (with their roles), a pending
        ownership transfer to them is cancelled, and they can't rejoin through
        any invitation until the ban is revoked. `reason` is optional (max 512
        characters).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/moderation_handler.banRequest"
        description: Who to ban and, optionally, why
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/moderation.BanResponse"
        "400":
          description: missing user_id, banning yourself, or invalid reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing BAN_MEMBERS, target is the owner, or target has an equal or
            higher role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or target is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: target is already banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Ban a member from the server
      tags:
        - moderation
  "/v1/servers/{serverId}/bans/{userId}":
    delete:
      description: "Requires BAN_MEMBERS (the owner and administrators hold it
        implicitly). There is no hierarchy check. The user does not become a
        member again: they can rejoin with any valid invitation, and get the
        default role like any new member."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: ID of the banned user
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid server id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing BAN_MEMBERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or the user is not banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Revoke a ban
      tags:
        - moderation
  "/v1/servers/{serverId}/categories":
    post:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/category_handler.createCategoryRequest"
        description: Category name
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a category
      tags:
        - categories
  "/v1/servers/{serverId}/categories/reorder":
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `category_ids` is the full, final order.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/category_handler.reorderCategoriesRequest"
        description: Category IDs in their new order
        required: true
      responses:
        "200":
          description: ok
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Reorder a server's categories
      tags:
        - categories
  "/v1/servers/{serverId}/channels":
    post:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `kind` is "text" or "voice"; `category_id` may be omitted/null, which
        defaults the channel to the server's "Sin asignar" fallback category
        ("no category" is not a valid state).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channel_handler.createChannelRequest"
        description: Channel name, kind and optional category
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a channel
      tags:
        - channels
  "/v1/servers/{serverId}/channels/reorder":
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `channel_ids` is the full, final order for that category (or for "sin
        categoria" if `category_id` is omitted/null).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channel_handler.reorderChannelsRequest"
        description: Category and the channel IDs in their new order
        required: true
      responses:
        "200":
          description: ok
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Reorder channels within a category
      tags:
        - channels
  "/v1/servers/{serverId}/default-role":
    put:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        The default role is assigned automatically to new members.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.setDefaultRoleRequest"
        description: ID of the role to use as default
        required: true
      responses:
        "204":
          description: no content
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or the role is not below your highest
            role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set the server's default role
      tags:
        - roles
  "/v1/servers/{serverId}/icon":
    get:
      description: Public (no JWT required) -- binary image, so a plain `<img src>`
        can load it.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the icon image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server, or icon, not found
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      summary: Get a server's icon
      tags:
        - servers
  "/v1/servers/{serverId}/invites":
    get:
      description: "Same permission as generating one: administrators, or members
        whose roles grant CREATE_INVITE. Returns all invitations (active,
        revoked or expired, no status filter on the backend), newest first."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/model.InvitationResponse"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller cannot invite (not an administrator nor holds CREATE_INVITE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's invitations
      tags:
        - invitations
    post:
      description: Administrators, or members whose roles grant CREATE_INVITE. Body is
        optional JSON; omitting max_uses means unlimited uses. Expires in 7
        days.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.GenerateInvitationRequest"
        description: Optional max_uses
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.InvitationResponse"
        "400":
          description: invalid max_uses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller cannot invite (not an administrator nor holds CREATE_INVITE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Generate an invitation
      tags:
        - invitations
  "/v1/servers/{serverId}/members":
    get:
      description: Caller must already be a member. Paginated. Each member carries
        their public profile (name, avatar, description, status), replicated
        from identify; profile is null until it has been replicated, and may lag
        a few seconds behind a profile edit.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Page size
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        - description: Items to skip
          in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.MemberListResponse"
        "400":
          description: invalid limit/offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's members
      tags:
        - membership
  "/v1/servers/{serverId}/members/{userId}":
    delete:
      description: "Self-leave only: userId must be the caller's own. The owner cannot
        leave (transfer ownership or delete the server first)."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Must match the caller's own user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: userId is not the caller
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: the owner cannot leave; transfer ownership or delete the server first
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Leave a server
      tags:
        - membership
  "/v1/servers/{serverId}/members/{userId}/permissions":
    get:
      description: "The permissions the member actually holds: every permission for
        the owner and for members with ADMINISTRATOR, otherwise the union of the
        permissions of their roles. Any member of the server can look up any
        other member."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/member_role_handler.memberPermissionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or the user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a member's effective permissions
      tags:
        - member-roles
  "/v1/servers/{serverId}/members/{userId}/roles":
    get:
      description: Any member of the server can look up any other member.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/roleview.Response"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or the user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a member's roles
      tags:
        - member-roles
    post:
      description: "Administrators only (the owner, or a member with ADMINISTRATOR).
        Idempotent: assigning a role the member already has succeeds without
        changing anything."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/member_role_handler.assignRoleRequest"
        description: ID of the role to assign
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or the role is not below your highest
            role, or the role carries a permission you do not hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Assign a role to a member
      tags:
        - member-roles
  "/v1/servers/{serverId}/members/{userId}/roles/{roleId}":
    delete:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or unassigning a role with
            ADMINISTRATOR from yourself, or the role is not below your highest
            role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server or role not found, or the member doesn't have the role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Remove a role from a member
      tags:
        - member-roles
  "/v1/servers/{serverId}/ownership-transfers":
    post:
      description: Owner-only. Creates a pending transfer; nothing changes until the
        recipient responds. Rejects if to_user_id isn't a member, or a transfer
        is already pending for this server.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.InitiateOwnershipTransferRequest"
        description: Target member's user ID
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "400":
          description: to_user_id required, not a member, or already the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: a transfer is already pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Offer ownership to another member
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/{transferId}/accept":
    post:
      description: Recipient-only. On success the caller becomes the new owner and the
        previous owner becomes a regular member.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Transfer ID
          in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: no longer pending (expired, cancelled, or already resolved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Accept a pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/{transferId}/cancel":
    post:
      description: Initiator (owner) only. Withdraws it before the recipient responds,
        e.g. to offer it to someone else instead.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Transfer ID
          in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the initiator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Cancel a pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/{transferId}/reject":
    post:
      description: Recipient-only. Ownership is left untouched; the original owner keeps it.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Transfer ID
          in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Reject a pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/pending":
    get:
      description: Any member can view it. A transfer past its 24h TTL is rejected on
        read and reported as not found (see the Expirer sweep for the background
        equivalent).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: no pending transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get the server's pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/roles":
    get:
      description: Any member of the server. Ordered by hierarchy (position 1 = highest).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/roleview.Response"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's roles
      tags:
        - roles
    post:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.createRoleRequest"
        description: Role name and color
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a role
      tags:
        - roles
  "/v1/servers/{serverId}/roles/reorder":
    patch:
      description: "Administrators only (the owner, or a member with ADMINISTRATOR).
        `role_ids` is the full, final hierarchy, highest first: it must contain
        every role of the server exactly once. Positions are rewritten to 1..N.
        A non-owner administrator can only rearrange the roles below their own
        highest role."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.reorderRolesRequest"
        description: Role IDs in their new order, highest first
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/roleview.Response"
                type: array
        "400":
          description: invalid body, or the list doesn't match the server's roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or moving a role at or above your
            highest role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Reorder the server's role hierarchy
      tags:
        - roles
servers:
  - url: /
components:
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and the JWT (already validated by
        Kong; this service trusts the forwarded identity).
      in: header
      name: Authorization
      type: apiKey
  schemas:
    apierr.ErrorDetail:
      properties:
        code:
          example: 404
          type: integer
        details:
          additionalProperties: {}
          type: object
        message:
          example: server not found
          type: string
      type: object
    apierr.ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/apierr.ErrorDetail"
      type: object
    category_handler.createCategoryRequest:
      properties:
        name:
          type: string
      type: object
    category_handler.reorderCategoriesRequest:
      properties:
        category_ids:
          items:
            type: string
          type: array
      type: object
    category_handler.updateCategoryRequest:
      properties:
        name:
