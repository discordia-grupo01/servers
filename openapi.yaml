openapi: 3.0.3
info:
  title: Discordia - Servers
  version: "1.0.0"
  description: >
    Servers service. Covered story: "Create server".
    All /v1/** routes require identity: the JWT is validated by Kong at the
    gateway, and this service takes the user id from the X-User-Id header (or from
    the "sub" claim of the token Kong forwards).

servers:
  - url: http://localhost:8000
    description: Through the gateway (Kong)
  - url: http://localhost:8080
    description: Directly to the service

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Channel:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: general }
        kind: { type: string, enum: [text, voice] }
        position: { type: integer, example: 0 }
    Invitation:
      type: object
      properties:
        code: { type: string, example: 8sKq2Zr1a9Xa }
        url:
          type: string
          description: Relative invite link (append to the frontend base URL).
          example: /invite/8sKq2Zr1a9Xa
        server_id: { type: string, format: uuid }
        created_by: { type: string, description: user id of the member who generated it }
        max_uses:
          type: integer
          nullable: true
          description: Null means unlimited uses.
          example: 10
        uses: { type: integer, example: 0 }
        expires_at:
          type: string
          format: date-time
          description: Always set. Fixed at 7 days after creation.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Non-null once the invitation has been revoked.
        created_at: { type: string, format: date-time }
    JoinResult:
      type: object
      properties:
        server_id: { type: string, format: uuid }
        already_member:
          type: boolean
          description: >
            true when the caller was already a member; no new membership is
            created and no invitation use is consumed.
    Server:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: My Community }
        icon_url:
          type: string
          nullable: true
          description: Relative URL to fetch the icon, or null if there is none.
        owner_id: { type: string, description: user id of the creator }
        created_at: { type: string, format: date-time }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              description: HTTP status code.
              example: 400
            message:
              type: string
              example: name is too long
            details:
              type: object
              additionalProperties: true
              description: Structured context; {} when there is nothing to add.
              example: { field: name, reason: name_too_long }

security:
  - bearerAuth: []

paths:
  /livez:
    get:
      summary: Liveness check
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness check
      security: []
      responses:
        "200": { description: OK }
        "503": { description: Dependencies unavailable }

  /v1/servers:
    post:
      summary: Create a server
      description: >
        Creates a server, makes the authenticated user its owner, and
        automatically generates one text channel ("general") and one voice
        channel ("General").
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: >
                    2..100 characters (counted after Unicode NFC normalization,
                    so an accented letter counts as one). Control characters are
                    rejected. Uniqueness per owner is case-, accent- and
                    whitespace-insensitive.
                icon:
                  type: string
                  format: binary
                  description: Optional. PNG, JPEG or WEBP, up to 2 MB.
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400":
          description: >
            Invalid name (empty, out of range, or containing control characters)
            or invalid icon (unsupported format or size). The server is not created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The authenticated user already has a server with that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/servers/{id}/invites:
    post:
      summary: Generate an invitation
      description: >
        A member of the server generates a unique invite link. It expires 7 days
        after creation (fixed server-side, not client-configurable). "max_uses"
        is optional: omit it for unlimited uses.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses:
                  type: integer
                  minimum: 1
                  description: Optional. Max number of successful joins before the link stops working.
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400":
          description: "max_uses is not a positive number, or the body is not valid JSON."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The caller is not a member of the server and cannot invite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The server does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/invites/{code}:
    delete:
      summary: Revoke an invitation
      description: >
        Deactivates the invitation immediately. Idempotent: revoking an already
        revoked invitation still returns 204.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Invitation revoked (or already revoked) }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The caller is not a member of the invitation's server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No invitation with that code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/invites/{code}/join:
    post:
      summary: Join a server via an invitation
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: The caller joined the server with the default role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResult" }
        "200":
          description: >
            The caller was already a member; returned straight to the server
            without duplicating the membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResult" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The caller is banned from the server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            The invitation is invalid: no such code, or it was revoked, has
            expired, or reached its use limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
