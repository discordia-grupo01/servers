openapi: 3.0.3
info:
  title: Discordia - Servers
  version: "1.0.0"
  description: >
    Servers service. Covered story: "Create server".
    All /v1/** routes require identity: the JWT is validated by Kong at the
    gateway, and this service takes the user id from the X-User-Id header (or from
    the "sub" claim of the token Kong forwards).

servers:
  - url: http://localhost:8000
    description: Through the gateway (Kong)
  - url: http://localhost:8080
    description: Directly to the service

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Channel:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: general }
        kind: { type: string, enum: [text, voice] }
        position: { type: integer, example: 0 }
    Server:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: My Community }
        icon_url:
          type: string
          nullable: true
          description: Relative URL to fetch the icon, or null if there is none.
        owner_id: { type: string, description: user id of the creator }
        created_at: { type: string, format: date-time }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              description: HTTP status code.
              example: 400
            message:
              type: string
              example: name is too long
            details:
              type: object
              additionalProperties: true
              description: Structured context; {} when there is nothing to add.
              example: { field: name, reason: name_too_long }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        server_id: { type: string, format: uuid }
        name: { type: string, example: Moderator }
        color: { type: string, example: "#FF00AA", description: Hex color, #RRGGBB. }
        permissions:
          type: array
          items:
            type: string
            enum: [VIEW_CHANNELS, SEND_MESSAGES, MANAGE_CHANNELS, MANAGE_ROLES, KICK_MEMBERS, BAN_MEMBERS, MANAGE_SERVER]
          example: [SEND_MESSAGES, MANAGE_CHANNELS]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

security:
  - bearerAuth: []

paths:
  /livez:
    get:
      summary: Liveness check
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness check
      security: []
      responses:
        "200": { description: OK }
        "503": { description: Dependencies unavailable }

  /v1/servers:
    post:
      summary: Create a server
      description: >
        Creates a server, makes the authenticated user its owner, and
        automatically generates one text channel ("general") and one voice
        channel ("General").
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: >
                    2..100 characters (counted after Unicode NFC normalization,
                    so an accented letter counts as one). Control characters are
                    rejected. Uniqueness per owner is case-, accent- and
                    whitespace-insensitive.
                icon:
                  type: string
                  format: binary
                  description: Optional. PNG, JPEG or WEBP, up to 2 MB.
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400":
          description: >
            Invalid name (empty, out of range, or containing control characters)
            or invalid icon (unsupported format or size). The server is not created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The authenticated user already has a server with that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/servers/{serverId}/roles:
    post:
      summary: Create a role
      description: Only the server owner can create roles. Permissions start empty.
      parameters:
        - name: serverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                color: { type: string, example: "#FF00AA" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400":
          description: Invalid name or color.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The authenticated user is not the server owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Server not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List a server's roles
      parameters:
        - name: serverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "404":
          description: Server not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/roles/{roleId}:
    patch:
      summary: Update a role's permissions (and optionally its name/color)
      description: >
        Only the server owner (of the role's server) can edit it. `permissions`
        omitted means "leave the current permissions untouched"; an empty array
        clears them. `name`/`color` are optional too.
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items: { type: string }
                  example: [SEND_MESSAGES, MANAGE_CHANNELS]
                name: { type: string }
                color: { type: string }
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400":
          description: Invalid name, color, or an unknown permission name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The authenticated user is not the owner of the role's server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Role not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a role
      description: >
        Only the server owner (of the role's server) can delete it. Any
        member assignment of this role is removed automatically (`member_roles`
        cascades on the role's FK); if this was the server's default role,
        `servers.default_role_id` is set to NULL.
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Role deleted
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The authenticated user is not the owner of the role's server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Role not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/servers/{serverId}/default-role:
    put:
      summary: Set the server's default role for new members
      description: >
        Only the server owner can set this. The role must belong to this
        server. The default role is what new members will get assigned when
        they join (applying it on join is out of scope until the "join
        server" flow exists).
      parameters:
        - name: serverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string, format: uuid }
      responses:
        "200":
          description: Default role set.
        "400":
          description: The role belongs to a different server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing authentication credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The authenticated user is not the server owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Server or role not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
