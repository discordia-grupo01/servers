            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Check membership of a server
      tags:
        - servers
  "/v1/servers/{serverId}/mentions/resolve":
    post:
      description: Called by messaging with the author's token before saving a
        message. Takes the users, roles and @everyone mentioned in it and
        returns which mentions hold and who gets notified. `user_ids` keeps only
        members of the server. `role_ids` (never @everyone's own id) and
        `everyone` count only if the caller holds MENTION_EVERYONE (the owner
        and administrators hold it implicitly); otherwise they come back
        empty/false, so the message can still go out with them as plain text.
        `recipient_ids` are the members reached who can see the channel
        (VIEW_CHANNELS), without the caller. Duplicates count once; at most 50
        users and 20 roles.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mention_handler.resolveRequest"
        description: Channel of the message and the mentions found in it
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mention.ResolutionResponse"
        "400":
          description: invalid body, channel_id or role id, channel of another server, or
            too many mentions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server or channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Resolve the mentions of a message
      tags:
        - mentions
  "/v1/servers/{serverId}/mutes":
    post:
      description: Requires MANAGE_MESSAGES. The member remains in the server and
        connected sessions stay open, but message sends and voice publishing are
        denied until until_at.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/moderation_handler.muteRequest"
        description: Mute details
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: missing user_id, muting yourself, until_at not in the future, or
            invalid reason
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_MESSAGES, target is the owner, or target has an
            equal or higher role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found, or target is not a member
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Temporarily mute a member
      tags:
        - moderation
  "/v1/servers/{serverId}/mutes/{userId}":
    delete:
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Muted user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          description: user is not muted in this server
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Remove a member mute
      tags:
        - moderation
  "/v1/servers/{serverId}/ownership-transfers":
    post:
      description: Owner-only. Creates a pending transfer; nothing changes until the
        recipient responds. Rejects if to_user_id isn't a member, or a transfer
        is already pending for this server.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.InitiateOwnershipTransferRequest"
        description: Target member's user ID
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "400":
          description: to_user_id required, not a member, or already the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: a transfer is already pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Offer ownership to another member
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/{transferId}/accept":
    post:
      description: Recipient-only. On success the caller becomes the new owner and the
        previous owner becomes a regular member.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Transfer ID
          in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: no longer pending (expired, cancelled, or already resolved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Accept a pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/{transferId}/cancel":
    post:
      description: Initiator (owner) only. Withdraws it before the recipient responds,
        e.g. to offer it to someone else instead.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Transfer ID
          in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the initiator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Cancel a pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/{transferId}/reject":
    post:
      description: Recipient-only. Ownership is left untouched; the original owner keeps it.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Transfer ID
          in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Reject a pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/ownership-transfers/pending":
    get:
      description: Any member can view it. A transfer past its 24h TTL is rejected on
        read and reported as not found (see the Expirer sweep for the background
        equivalent).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.OwnershipTransferResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: no pending transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get the server's pending ownership transfer
      tags:
        - ownership-transfers
  "/v1/servers/{serverId}/reports":
    get:
      description: "Only for moderators: MANAGE_MESSAGES, KICK_MEMBERS and BAN_MEMBERS
        held together (the owner and administrators hold them implicitly).
        Newest first. status filters by pending (default), resolved, dismissed
        or all; \"total\" is the number of reports with that status, so GET
        ?status=pending&limit=1 gives the pending count. Each report carries the
        replicated profile of the reporter and, for a user report, of the
        reported user (null when it hasn't arrived yet)."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: pending (default), resolved, dismissed or all
          in: query
          name: status
          schema:
            type: string
        - description: Page size (default 20, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Reports to skip
          in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/report.ListResponse"
        "400":
          description: invalid status, limit or offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a member, or not a moderator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List the server's reports
      tags:
        - reports
    post:
      description: "Any member of the server can report. With kind \"message\" send
        channel_id and message_id (the channel must be a text channel of the
        server that the reporter can see); with kind \"user\" send user_id (a
        current member, not the reporter). The reason is required, at most 512
        characters. Members with moderation permissions (MANAGE_MESSAGES,
        KICK_MEMBERS and BAN_MEMBERS, held together; the owner and
        administrators hold them implicitly) review it through GET
        /v1/servers/{serverId}/reports. The server cannot check that the message
        exists: messaging owns it. A reporter can't have two pending reports
        about the same message or user (409 report_already_pending); once it is
        closed they can report it again."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/report_handler.CreateRequest"
        description: What is reported and why
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/report.Response"
        "400":
          description: invalid kind, missing target or reason, reason too long, not a text
            channel, or reporting yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server, channel or reported user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: report_already_pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Report a message or a user
      tags:
        - reports
  "/v1/servers/{serverId}/reports/{reportId}":
    patch:
      description: "Only for moderators (see GET /v1/servers/{serverId}/reports).
        Marks the report as resolved (the moderator acted on it) or dismissed
        (nothing to act on). A report is closed once: closing it again is a 409
        report_not_pending. Acting on the reported message or user is done with
        the existing moderation endpoints."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
        - description: Report ID
          in: path
          name: reportId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/report_handler.CloseRequest"
        description: The new status
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/report.Response"
        "400":
          description: status is not resolved or dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a member, or not a moderator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server or report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: report_not_pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Close a pending report
      tags:
        - reports
  "/v1/servers/{serverId}/roles":
    get:
      description: Any member of the server. Ordered by hierarchy (position 1 = highest).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/roleview.Response"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a server's roles
      tags:
        - roles
    post:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.createRoleRequest"
        description: Role name and color
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a role
      tags:
        - roles
  "/v1/servers/{serverId}/roles/reorder":
    patch:
      description: "Administrators only (the owner, or a member with ADMINISTRATOR).
        `role_ids` is the full, final hierarchy, highest first: it must contain
        every role of the server exactly once. Positions are rewritten to 1..N.
        A non-owner administrator can only rearrange the roles below their own
        highest role."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.reorderRolesRequest"
        description: Role IDs in their new order, highest first
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/roleview.Response"
                type: array
        "400":
          description: invalid body, or the list doesn't match the server's roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or moving a role at or above your
            highest role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Reorder the server's role hierarchy
      tags:
        - roles
  "/v1/servers/{serverId}/vanity":
    patch:
      description: "Requires MANAGE_SERVER. Setting a code needs boost level 3; a null
        code clears it at any level. The code goes in POST
        /v1/invites/{code}/join: 3 to 32 letters, numbers or hyphens, not
        starting or ending with a hyphen, and stored in lowercase. If the server
        drops below level 3 the code is kept but stops working, and nobody else
        can take it."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/boost_handler.VanityRequest"
        description: The code, or null to clear it
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/boost_handler.VanityResponse"
        "400":
          description: invalid code or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_SERVER, or boost_level_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: vanity_code_taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set or clear a server's vanity code
      tags:
        - boosts
