openapi: 3.0.0
info:
  contact: {}
  description: >-
    Servers service: servers, channels, categories, roles, member roles,
    membership, invitations, ownership transfer, mentions.

    All /v1/** routes require identity: the JWT is validated by Kong at the gateway, and this service takes the user id from the X-User-Id header (or from the "sub" claim of the token Kong forwards).
  title: Discordia - Servers
  version: 1.0.0
paths:
  /livez:
    get:
      responses:
        "200":
          description: ok
      summary: Liveness check
      tags:
        - ops
  /readyz:
    get:
      description: Also pings the database when one is configured.
      responses:
        "200":
          description: ready
        "503":
          description: database unavailable
      summary: Readiness check
      tags:
        - ops
  "/v1/categories/{categoryId}":
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Category ID
          in: path
          name: categoryId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/category_handler.updateCategoryRequest"
        description: New category name
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Rename a category
      tags:
        - categories
  "/v1/channels/{channelId}":
    delete:
      description: Administrators only (the owner, or a member with ADMINISTRATOR). A
        channel hidden from the caller by a permission override (no
        VIEW_CHANNELS there) is reported as 404, as if it didn't exist.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete a channel
      tags:
        - channels
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `name`/`topic` omitted leave the field unchanged. A channel hidden from
        the caller by a permission override (no VIEW_CHANNELS there) is reported
        as 404, as if it didn't exist.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channel_handler.updateChannelRequest"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit a channel
      tags:
        - channels
  "/v1/channels/{channelId}/category":
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        `category_id` omitted/null moves it to the server's "Sin asignar"
        fallback category ("no category" is not a valid state). A channel hidden
        from the caller by a permission override (no VIEW_CHANNELS there) is
        reported as 404, as if it didn't exist.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channel_handler.moveChannelRequest"
        description: Target category (or null)
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Move a channel to a category
      tags:
        - channels
  "/v1/channels/{channelId}/members/{userId}/permissions":
    get:
      description: "What the member may actually do in this channel: their server-wide
        permissions with the channel's overrides for their roles applied
        (@everyone first, then their other roles, where allow wins over deny).
        Every permission for the owner and for members with ADMINISTRATOR,
        whatever the overrides. Same response shape and access rule as GET
        /v1/servers/{serverId}/members/{userId}/permissions, which ignores
        overrides: services that authorize per channel (messaging, voice) should
        use this one."
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
        - description: Target member's user ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelperm_handler.effectivePermissionsResponse"
        "400":
          description: invalid channel id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the channel's server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: channel not found, or the user is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a member's effective permissions in a channel
      tags:
        - channel-permissions
  "/v1/channels/{channelId}/permissions":
    get:
      description: One entry per role with an override in this channel, @everyone
        first and then in the order of the role hierarchy. Roles without an
        override use their server-wide permissions and are not listed. Requires
        MANAGE_ROLES.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/channelperm_handler.OverrideResponse"
                type: array
        "400":
          description: invalid channel id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_ROLES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: channel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List a channel's permission overrides
      tags:
        - channel-permissions
  "/v1/channels/{channelId}/permissions/roles/{roleId}":
    delete:
      description: The role goes back to its server-wide permissions in this channel.
        Same authorization as setting it, without the grant check.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id, or role from another server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_ROLES, or role not below the caller's (role_above_own)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: channel or role not found, or the role has no override in this
            channel (channel_override_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Remove a role's permission override in a channel
      tags:
        - channel-permissions
    put:
      description: Creates or replaces what the role gains (allow) and loses (deny) in
        this channel only; the role's server-wide permissions don't change. Only
        VIEW_CHANNELS, SEND_MESSAGES, MANAGE_MESSAGES and ADD_REACTIONS can be
        overridden. With both lists empty the override is removed (204).
        Requires MANAGE_ROLES (administrators and the owner hold it implicitly),
        and the role must be below the caller's highest role -- @everyone
        excepted. The caller can only allow permissions they hold themselves.
        Overrides never restrict the owner or administrators.
      parameters:
        - description: Channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
        - description: Role ID (it may be @everyone)
          in: path
          name: roleId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/channelperm_handler.setOverrideRequest"
        description: Permissions to allow and to deny in this channel
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/channelperm_handler.OverrideResponse"
        "204":
          description: "both lists empty: the override was removed"
        "400":
          description: invalid id or body, unknown permission, server-level permission
            (permission_not_overridable), the same permission allowed and denied
            (permission_conflict), or role from another server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_ROLES, role not below the caller's (role_above_own),
            or allowing a permission the caller doesn't hold
            (permission_not_held)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: channel or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Set a role's permission override in a channel
      tags:
        - channel-permissions
  "/v1/channels/{channelId}/voice-access":
    get:
      description: "Confirms that the authenticated user can connect to a voice
        channel: they must see it and hold CONNECT in it, with its per-role
        overrides applied (#57, #17). 403 for a non-member or a member without
        CONNECT in the channel, 404 if the channel does not exist or is hidden
        from them."
      parameters:
        - description: Voice channel ID
          in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/voice_access_handler.response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Check voice channel access
      tags:
        - voice
  "/v1/invites/{code}":
    delete:
      description: "Administrators revoke any invitation of the server; any member can
        revoke the ones they created. Idempotent: revoking an already-revoked
        code still returns 204."
      parameters:
        - description: Invitation code
          in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not an administrator nor the invitation's creator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: invitation not found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Revoke an invitation
      tags:
        - invitations
  "/v1/invites/{code}/join":
    post:
      description: One-step join (no separate "preview" endpoint). Returns 200 instead
        of 201 if the caller was already a member.
      parameters:
        - description: Invitation code
          in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.JoinResponse"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.JoinResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: user is banned from the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: invalid, revoked, expired or exhausted code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Join a server via an invitation code
      tags:
        - invitations
  "/v1/roles/{roleId}":
    delete:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
      parameters:
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or deleting a role with ADMINISTRATOR
            that you hold, or the role is not below your highest role
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete a role
      tags:
        - roles
    get:
      description: Any member of the role's server.
      parameters:
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: the caller is not a member of the role's server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a role
      tags:
        - roles
    patch:
      description: Administrators only (the owner, or a member with ADMINISTRATOR).
        Any of `permissions`/`name`/`color` may be omitted to leave it
        unchanged.
      parameters:
        - description: Role ID
          in: path
          name: roleId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/role_handler.updateRolePermissionsRequest"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/roleview.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator, or removing ADMINISTRATOR from a role
            you hold, or the role is not below your highest role, or adding a
            permission you do not hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit a role
      tags:
        - roles
  /v1/servers:
    get:
      description: Servers the caller is a member of, each with only the channels the
        caller can see (channels where an override takes VIEW_CHANNELS away from
        them are left out; the owner and administrators see all).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/handler.serverResponse"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List my servers
      tags:
        - servers
    post:
      description: Creates a server owned by the caller (identity from the JWT).
        Multipart form body.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: Server name
                  type: string
                icon:
                  description: Server icon image
                  type: string
                  format: binary
              required:
                - name
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.serverResponse"
        "400":
          description: invalid name, or icon too large/unreadable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Create a server
      tags:
        - servers
  "/v1/servers/{serverId}":
    delete:
      description: Permanently deletes the server with its channels, categories,
        roles, members, invitations, bans and messages. Only the owner can do
        it, and only after confirming by sending the server's exact name in
        confirm_name. Not reversible.
      parameters:
        - description: Server id (UUID)
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/handler.deleteServerRequest"
        description: Confirmation
        required: true
      responses:
        "204":
          description: deleted
        "400":
          description: invalid body, or confirm_name missing or different from the server
            name
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not the server owner
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Delete a server
      tags:
        - servers
    get:
      description: "Full detail of one server, including its categories and the
        channels the caller can see: channels where an override takes
        VIEW_CHANNELS away from them are left out (the owner and administrators
        see all). A caller who isn't a member gets the server with no channels."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.serverResponse"
        "400":
          description: malformed serverId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Get a server
      tags:
        - servers
    patch:
      description: "Administrators only (the owner, or a member with ADMINISTRATOR).
        Multipart form, all fields optional: rename, replace the icon/banner, or
        remove the banner."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: New server name
                  type: string
                icon:
                  description: New icon image
                  type: string
                  format: binary
                banner:
                  description: New banner image
                  type: string
                  format: binary
                remove_banner:
                  description: Pass \
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.serverResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: not a server administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "409":
          description: name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Edit a server
      tags:
        - servers
  "/v1/servers/{serverId}/banned-words":
    get:
      description: Requires MANAGE_MESSAGES (the owner and administrators hold it
        implicitly). Words come lowercased, in the order they were saved.
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/word_filter_handler.BannedWordsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_MESSAGES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found or not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: List the server's banned words
      tags:
        - moderation
    put:
      description: "Requires MANAGE_MESSAGES (the owner and administrators hold it
        implicitly). Sends the whole list: it replaces the previous one, and an
        empty list removes the filter. Each entry is a word or a phrase, at most
        50 characters, up to 100 entries; they are trimmed, lowercased and
        deduplicated. Messages that contain one are rejected by messaging from
        then on (matching ignores case and accents and only takes whole words);
        messages already sent are not touched."
      parameters:
        - description: Server ID
          in: path
          name: serverId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/word_filter_handler.BannedWordsRequest"
        description: The whole list
        required: true
      responses:
        "200":
          description: the list as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/word_filter_handler.BannedWordsResponse"
        "400":
          description: empty, too long or invalid word, or more than 100
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "403":
          description: missing MANAGE_MESSAGES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
        "404":
          description: server not found or not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apierr.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Replace the server's banned words
      tags:
        - moderation
  "/v1/servers/{serverId}/banner":
    get:
      description: Public (no JWT required) -- binary image, so a plain `<img src>`
        can load it.
      parameters:
