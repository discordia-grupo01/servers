name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordia_servicio
          POSTGRES_USER: discordia
          POSTGRES_PASSWORD: discordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discordia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - name: Regenerar openapi.yaml
        run: make openapi
      - name: Commitear openapi.yaml si cambió
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(openapi): regenerate openapi.yaml [skip ci]"
          file_pattern: openapi.yaml
      - name: Tests (unitarios + integracion contra Postgres y RabbitMQ reales)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: discordia_servicio
          DATABASE_USER: discordia
          DATABASE_PASSWORD: discordia
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        # -p 1: varios paquetes de integracion (test/repository/**, test/e2e)
        # dropean y recrean el schema contra la misma base -- si corren en
        # paralelo se pisan entre si (ver seccion "Tests" del README).
        # -coverpkg=./internal/...: sin esto, los paquetes que solo se
        # ejercitan via test/e2e (HTTP -> DB real) reportan 0% aunque esten
        # cubiertos (mismo fix que identify-service).
        run: go test ./... -p 1 -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Verificar cobertura minima (70%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 70)}"; then
            echo "::error::Cobertura ${COVERAGE}% por debajo del minimo requerido (70%)"
            exit 1
          fi

  # Construye la imagen y la publica en Artifact Registry. Solo corre en push a
  # main y despues de que pase `test`. Se autentica con Workload Identity
  # Federation (sin claves de larga duracion).
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/discordia-509215/discordia-servers/mi-servicio
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Construir imagen
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Publicar imagen
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Despliega la imagen del commit en discordia-servers-vm. Entra por SSH a
  # traves de un tunel IAP (el puerto 22 no hace falta abrirlo a internet). La
  # clave SSH solo puede ejecutar ~/deploy.sh en la VM (ver deploy/deploy.sh),
  # que valida el tag, recrea el contenedor, hace smoke test de /readyz y vuelve
  # atras si falla.
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-servers
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      VM_USER: manup
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VM_SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Desplegar en discordia-servers-vm
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[localhost]:2222 $VM_SSH_HOST_KEY" > ~/.ssh/known_hosts

          gcloud compute start-iap-tunnel discordia-servers-vm 22 \
            --local-host-port=localhost:2222 \
            --zone us-central1-a --project discordia-509215 > /tmp/iap.log 2>&1 &
          TUNNEL_PID=$!
          trap 'kill $TUNNEL_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if nc -z localhost 2222; then break; fi
            sleep 1
          done
          nc -z localhost 2222 || { echo "No se pudo abrir el tunel IAP"; cat /tmp/iap.log; exit 1; }

          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VM_USER@localhost" "${{ github.sha }}"
