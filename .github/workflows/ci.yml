name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordia_servicio
          POSTGRES_USER: discordia
          POSTGRES_PASSWORD: discordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discordia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - name: Tests (unitarios + integracion contra Postgres y RabbitMQ reales)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: discordia_servicio
          DATABASE_USER: discordia
          DATABASE_PASSWORD: discordia
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        # -p 1: varios paquetes de integracion (test/repository/**, test/e2e)
        # dropean y recrean el schema contra la misma base -- si corren en
        # paralelo se pisan entre si (ver seccion "Tests" del README).
        run: go test ./... -p 1 -cover
