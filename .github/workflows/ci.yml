name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      voice_instance_id:
        description: "ID de instancia/réplica de signaling (si aplica)"
        required: false
        type: string
      dry_run:
        description: "Ejecutar en modo simulación (--dry-run)"
        required: true
        default: true
        type: boolean

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordia_servicio
          POSTGRES_USER: discordia
          POSTGRES_PASSWORD: discordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U discordia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - name: Regenerar openapi.yaml
        run: make openapi
      - name: Commitear openapi.yaml si cambió
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(openapi): regenerate openapi.yaml [skip ci]"
          file_pattern: openapi.yaml
      - name: Tests (unitarios + integracion contra Postgres y RabbitMQ reales)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: discordia_servicio
          DATABASE_USER: discordia
          DATABASE_PASSWORD: discordia
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        # -p 1: varios paquetes de integracion (test/repository/**, test/e2e)
        # dropean y recrean el schema contra la misma base -- si corren en
        # paralelo se pisan entre si (ver seccion "Tests" del README).
        # -coverpkg=./internal/...: sin esto, los paquetes que solo se
        # ejercitan via test/e2e (HTTP -> DB real) reportan 0% aunque esten
        # cubiertos (mismo fix que identify-service).
        run: go test ./... -p 1 -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Verificar cobertura minima (70%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 70)}"; then
            echo "::error::Cobertura ${COVERAGE}% por debajo del minimo requerido (70%)"
            exit 1
          fi

  # Construye la imagen y la publica en Artifact Registry. Solo corre en push a
  # main y despues de que pase `test`. Se autentica con Workload Identity
  # Federation (sin claves de larga duracion).
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/discordia-509215/discordia-servers/mi-servicio
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Construir imagen
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Publicar imagen
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Aplica las migraciones pendientes contra la base de produccion con
  # `make migrate` (golang-migrate: segun la tabla schema_migrations, solo corre
  # las que todavia no se aplicaron). Va despues de publicar la imagen y antes
  # del deploy: el codigo nuevo arranca con el schema ya actualizado, y si una
  # migracion falla no se despliega.
  migrate:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-servers
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones en produccion
        env:
          DATABASE_HOST: ${{ secrets.PROD_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.PROD_DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.PROD_DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.PROD_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.PROD_DATABASE_PASSWORD }}
          DATABASE_SSLMODE: ${{ secrets.PROD_DATABASE_SSLMODE }}
          DATABASE_SCHEMA: ${{ secrets.PROD_DATABASE_SCHEMA }}
        run: |
          if [ -z "$DATABASE_HOST" ] || [ -z "$DATABASE_PASSWORD" ]; then
            echo "Faltan los secrets PROD_DATABASE_* (ver README, seccion Deploy)" >&2
            exit 1
          fi
          # La password va dentro de la URL de conexion que arma `make migrate`:
          # se codifica por si tiene caracteres especiales (@, :, /, #...) y se
          # enmascara, porque codificada ya no coincide con el secret y GitHub no
          # la ocultaria. `make -s` para que make no imprima el comando (con la URL).
          ENCODED=$(jq -rn --arg p "$DATABASE_PASSWORD" '$p|@uri')
          echo "::add-mask::$ENCODED"
          DATABASE_PASSWORD="$ENCODED" make -s migrate

  # Despliega la imagen del commit en discordia-servers-vm. Entra por SSH a
  # traves de un tunel IAP (el puerto 22 no hace falta abrirlo a internet). La
  # clave SSH solo puede ejecutar ~/deploy.sh en la VM (ver deploy/deploy.sh),
  # que valida el tag, recrea el contenedor, hace smoke test de /readyz y vuelve
  # atras si falla. Espera a `migrate`: no se despliega sin el schema al dia.
  deploy:
    needs: [publish, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-servers
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      VM_USER: manup
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VM_SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Desplegar en discordia-servers-vm
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[localhost]:2222 $VM_SSH_HOST_KEY" > ~/.ssh/known_hosts

          gcloud compute start-iap-tunnel discordia-servers-vm 22 \
            --local-host-port=localhost:2222 \
            --zone us-central1-a --project discordia-509215 > /tmp/iap.log 2>&1 &
          TUNNEL_PID=$!
          trap 'kill $TUNNEL_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if nc -z localhost 2222; then break; fi
            sleep 1
          done
          nc -z localhost 2222 || { echo "No se pudo abrir el tunel IAP"; cat /tmp/iap.log; exit 1; }

          ssh -i ~/.ssh/deploy_key -p 2222 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VM_USER@localhost" "${{ github.sha }}"

  # Job manual (workflow_dispatch) para hidratar la réplica de autorización de
  # voz en signaling. Conecta el runner a la tailnet vía Tailscale para llegar
  # a RabbitMQ/Postgres privados y ejecuta el binario `backfillvoice`.
  backfill-voice:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: backfill-voice
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Instalar y conectar Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "Falta el secret TS_AUTHKEY" >&2
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="gh-backfill-${{ github.run_id }}" \
            --accept-routes
          tailscale status

      - name: Ejecutar backfill de voz en producción
        env:
          DATABASE_HOST: ${{ secrets.PROD_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.PROD_DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.PROD_DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.PROD_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.PROD_DATABASE_PASSWORD }}
          DATABASE_SSLMODE: ${{ secrets.PROD_DATABASE_SSLMODE }}
          DATABASE_SCHEMA: ${{ secrets.PROD_DATABASE_SCHEMA }}
          RABBITMQ_URL: ${{ secrets.PROD_RABBITMQ_URL }}
          VOICE_INSTANCE_ID: ${{ inputs.voice_instance_id }}
        run: |
          if [ -z "$DATABASE_HOST" ] || [ -z "$DATABASE_PASSWORD" ] || [ -z "$RABBITMQ_URL" ]; then
            echo "Faltan secrets requeridos (PROD_DATABASE_* o PROD_RABBITMQ_URL)" >&2
            exit 1
          fi

          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          go run ./cmd/backfillvoice $ARGS

      - name: Desconectar Tailscale
        if: always()
        run: sudo tailscale logout || true